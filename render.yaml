services:
  - type: web
    name: elaya-smiles
    env: docker
    # Measured (v2.4.13): web process ~90-170 MB; GLOMOS worker ~200 MB private memory + ~120 MB shared
    # torch libraries. The free instance (512 MB, 0.1 CPU) runs GLOMOS up to oxytocin (135 atoms, ~15 min,
    # fast engine for >= 60 atoms). A bigger plan only makes it faster.
    plan: standard
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 5000
      - key: ELAYA_MAX_JOBS
        value: "1"
      - key: ELAYA_MAX_MINUTES
        value: "20"
      - key: ELAYA_TORCH_THREADS
        value: "auto"
