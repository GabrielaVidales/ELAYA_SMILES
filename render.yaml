services:
  - type: web
    name: elaya-smiles
    env: docker
    # GLOMOS (torch + ASE + ANI) needs ~1.2-1.8 GB while a job runs: use at least 'standard' (2 GB).
    # 'starter' (512 MB) only supports plain conversion; GLOMOS jobs would be killed (OOM).
    plan: standard
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 5000
      - key: ELAYA_MAX_JOBS
        value: "1"
      - key: ELAYA_MAX_MINUTES
        value: "20"
      - key: ELAYA_TORCH_THREADS
        value: "auto"
